flip2:
  # AG-win Configuration (Agent Listener Mode)
  # Connects to Hub at 192.168.1.53:8091

  agent:
    name: "AG-win"
    hub_url: "http://192.168.1.53:8091"
    api_key: "flip2_secret_key_123"
    poll_interval: "3s"

  backends:
    gemini:
      command: gemini
      args: ["-y", "--output-format", "text"]
      timeout: 180s
      type: process
