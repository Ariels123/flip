flip2:
  daemon:
    pid_file: /tmp/flip2d.pid
    log_file: /tmp/flip2d.log
    log_level: debug

  pocketbase:
    host: 0.0.0.0
    port: 8090
    data_dir: ./pb_data
    tls:
      enabled: false
      cert_file: ./certs/flip2.crt
      key_file: ./certs/flip2.key

  backends:
    claude:
      command: claude
      args:
        - "-p"
        - "--dangerously-skip-permissions"
        - "--output-format"
        - "text"
      timeout: 300s
      type: process

    gemini:
      command: gemini
      args:
        - "-y"
        - "--output-format"
        - "text"
      timeout: 180s
      type: process

    antigravity:
      type: http
      url: http://localhost:9222
      timeout: 300s

  scheduler:
    timezone: UTC
    max_concurrent_jobs: 4
    jobs:
      health-check:
        cron: "0 */1 * * * *"
        enabled: true
      task-executor:
        cron: "*/30 * * * * *"
        enabled: true

  executor:
    max_concurrent_tasks: 3
    default_timeout: 900s  # Increased from 300s to 900s (15 min) for implementation tasks
    retry_attempts: 2
    retry_delay: 30s
    worker_prefix: |
      ROLE: Go Expert & Autonomous Worker.
      SKILL_PACK: skills/go_expert.md (Context Loaded).
      INSTRUCTION: Complete the assigned task. Output ONLY the code or JSON. No chatter.
      CONTEXT: You are part of the FLIP2 distributed agent system.

  metrics:
    enabled: true
    retention_days: 30

  security:
    admin_email: admin@localhost
    api_keys_enabled: true
    api_key: flip2_secret_key_123
    jwt_secret: flip2_jwt_secret_key_456
    bootstrap_api_key: flip2_bootstrap_key_789

  sync:
    enabled: true
    node_id: mac
    sync_interval: 15s
    peers:
      - id: windows
        url: http://192.168.1.220:8090
        api_key: flip2_secret_key_123
        enabled: true
        # Port 8090 = Production on ALL systems (consistent convention)

  archiver:
    enabled: true  # RE-ENABLED: Fixed @ prefix for system fields
    active_retention_days: 3
    recent_retention_days: 90
    check_interval: 6h
    batch_size: 200
    archive_path: archives/signals
    active_agents:
      - claude-mac
      - claude-win
    deprecated_agents:
      - gemini
      - claude
      - cli
      - antigravity

  commmonitor:
    enabled: true
    threshold: 0.75
    valid_agents:
      - Claud-win
      - claude-mac
      - ag-win
      - antigravity
      - gemini
      - comm-monitor
      - claude
      - cli
    typo_corrections:
      claude-win: Claud-win
      claudwin: Claud-win
      claud win: Claud-win
      calude-win: Claud-win
      cluad-win: Claud-win
      claud_win: Claud-win
      claud-win: Claud-win
      claude mac: claude-mac
      claudemac: claude-mac
      claude_mac: claude-mac
      cluade-mac: claude-mac
      calude-mac: claude-mac
      agwin: ag-win
      ag win: ag-win
      ag_win: ag-win
      anti-gravity: antigravity
      anti gravity: antigravity

  session_cleanup:
    enabled: true
    stale_threshold: 30m
    expiration_threshold: 168h  # 7 days
    orphan_threshold: 15m
    max_session_age: 720h       # 30 days
    batch_size: 100
    check_interval: 1h
